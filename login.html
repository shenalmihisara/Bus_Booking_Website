<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div id="response"></div>

    <div class="container-fluid">
        <div class="row min-vh-100">

            <!-- Left side - Image -->
            <div class="col-12 col-md-7 p-0">
                <img src="/image/ChatGPT Image Aug 10, 2026, 01_18_14 PM.png"
                    class="img-fluid w-100 h-100 object-fit-cover" alt="My Image">
            </div>

            <!-- Right Side Login -->
            <div class="col-12 col-md-5 d-flex align-items-center justify-content-center p-4">

                <div class="card border-0 shadow-lg rounded-4 p-4 w-100"
                    style="max-width: 430px; background: rgba(255,255,255,0.98);">

                    <!-- Brand -->
                    <div class="text-center mb-4">

                        <div class="bg-black text-white rounded-3 d-inline-block px-4 py-2 shadow-sm">
                            <h1 class="mb-0 fs-5 fw-bold">
                                SM Super Line
                            </h1>
                        </div>

                    </div>

                    <!-- Welcome -->
                    <div class="text-center mb-4">

                        <h4 class="fw-bold mb-1">
                            Welcome to Bus Booking
                        </h4>

                        <p class="text-secondary small mb-3">
                            Sign in to continue your journey
                        </p>

                        <!-- Login Type -->
                        <div class="d-flex justify-content-center gap-2">

                            <a href="/login.html" class="btn btn-primary btn-sm px-4 rounded-pill">User Login</a>
                            <a href="/admin_login.html" class="btn btn-dark btn-sm px-4 rounded-pill" onclick="adminLogiOnAction(event)">Admin Login</a>

                        </div>

                    </div>


                    <!-- Login Form -->

                    <!-- Username -->
                    <div class="mb-3">

                        <label for="userName" class="form-label fw-semibold small">
                            Email / Username
                        </label>

                        <div class="input-group">

                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-person"></i>
                            </span>

                            <input id="userName" type="text" placeholder="Enter your Email or Username"
                                class="form-control border-start-0">

                        </div>

                    </div>


                    <!-- Password -->
                    <div class="mb-3">

                        <label for="password" class="form-label fw-semibold small">
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input id="password" type="password" placeholder="Enter your Password"
                                class="form-control border-start-0">

                        </div>

                    </div>


                    <!-- Remember / Forgot -->

                    <div class="d-flex justify-content-between align-items-center mb-4">

                        <div class="form-check">

                            <input class="form-check-input" type="checkbox" id="rememberMe">

                            <label class="form-check-label small" for="rememberMe">
                                Remember me
                            </label>

                        </div>

                        <a href="#" class="small text-decoration-none fw-semibold">
                            Forgot password?
                        </a>

                    </div>

                    <button id="btnLogin" type="submit"
                        class="btn btn-primary w-100 py-2 rounded-3 fw-semibold shadow-sm">

                        <i class="bi bi-box-arrow-in-right"></i>
                        Log In

                    </button>

                    <div class="d-flex align-items-center my-4">

                        <hr class="flex-grow-1">

                        <span class="px-3 text-secondary small">
                            OR
                        </span>

                        <hr class="flex-grow-1">

                    </div>

                    <p class="text-center small text-secondary mb-3">

                        Don't have an account?

                        <a href="/Sing up.html" class="fw-bold text-primary text-decoration-none">

                            Create Account

                        </a>

                    </p>

                    <div class="text-center">

                        <a href="/index.html" class="btn btn-outline-dark btn-sm rounded-pill px-4">

                            <i class="bi bi-house"></i>
                            Back to Home

                        </a>

                    </div>

                </div>

            </div>

        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/app.js"></script>
    <script src="/loggin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
