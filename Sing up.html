<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/style.css">
</head>

<body>


    <div class="container-fluid">
        <div class="row min-vh-100">

            <!-- Left side - Image -->
            <div class="col-12 col-md-7 p-0">
                <img src="/image/ChatGPT Image Aug 10, 2026, 01_18_14 PM.png"
                    class="img-fluid w-100 h-100 object-fit-cover" alt="My Image">
            </div>

            <!-- Right side - Content -->
            <div class="col-12 col-md-5 d-flex align-items-center justify-content-center p-4">

                <div class="card border-0 shadow-lg rounded-4 p-4 w-100"
                    style="max-width: 430px; background: rgba(255,255,255,0.98);">

                    <!-- Brand -->
                    <div class="text-center mb-4">

                        <div class="bg-black text-white rounded-3 d-inline-block px-4 py-2 shadow-sm">
                            <h1 class="mb-0 fs-5 fw-bold">
                                SM Super Line
                            </h1>
                        </div>

                    </div>


                    <!-- Welcome -->
                    <div class="text-center mb-4">

                        <h4 class="fw-bold mb-1">
                            Create Your Account
                        </h4>

                        <p class="text-secondary small mb-0">
                            Join SM Super Line and book your journey
                        </p>

                    </div>


                    <!-- Full Name -->
                    <div class="mb-3">

                        <label for="txtFullName" class="form-label fw-semibold small">
                            Full Name
                        </label>

                        <div class="input-group">

                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-person"></i>
                            </span>

                            <input id="txtFullName" type="text" placeholder="Enter your Full Name"
                                class="form-control border-start-0">

                        </div>

                    </div>


                    <!-- Email -->
                    <div class="mb-3">

                        <label for="txtEmail" class="form-label fw-semibold small">
                            Email Address
                        </label>

                        <div class="input-group">

                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-envelope"></i>
                            </span>

                            <input id="txtEmail" type="email" placeholder="Enter your Email"
                                class="form-control border-start-0">

                        </div>

                    </div>


                    <!-- Username -->
                    <div class="mb-3">

                        <label for="txtUserName" class="form-label fw-semibold small">
                            Username
                        </label>

                        <div class="input-group">

                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-person-badge"></i>
                            </span>

                            <input id="txtUserName" type="text" placeholder="Choose a Username"
                                class="form-control border-start-0">

                        </div>

                    </div>


                    <!-- Password -->
                    <div class="mb-4">

                        <label for="txtPassword" class="form-label fw-semibold small">
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input id="txtPassword" type="password" placeholder="Create a Password"
                                class="form-control border-start-0">

                        </div>

                    </div>


                    <!-- Terms -->
                    <div class="form-check mb-4">

                        <input class="form-check-input" type="checkbox" id="terms">

                        <label class="form-check-label small text-secondary" for="terms">

                            I agree to the
                            <a href="#" class="text-primary text-decoration-none">
                                Terms & Conditions
                            </a>

                        </label>

                    </div>


                    <!-- Register Button -->

                    <button id="btnSingUp" type="submit"
                        class="btn btn-primary w-100 py-2 rounded-3 fw-semibold shadow-sm">

                        <i class="bi bi-person-plus"></i>
                        Create Account

                    </button>


                    <!-- Divider -->

                    <div class="d-flex align-items-center my-4">

                        <hr class="flex-grow-1">

                        <span class="px-3 text-secondary small">
                            OR
                        </span>

                        <hr class="flex-grow-1">

                    </div>


                    <!-- Login -->

                    <p class="text-center small text-secondary mb-3">

                        Already have an account?

                        <a href="/login.html" class="fw-bold text-primary text-decoration-none">

                            Sign In

                        </a>

                    </p>


                    <!-- Home -->

                    <div class="text-center">

                        <a href="/index.html" class="btn btn-outline-dark btn-sm rounded-pill px-4">

                            <i class="bi bi-house"></i>
                            Back to Home

                        </a>

                    </div>

                </div>

            </div>

        </div>
    </div>


    <script src="/app.js"></script>
    <script src="/register.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
